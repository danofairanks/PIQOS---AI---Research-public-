name: paper_rigor worklist-triage live demo (manual)

# Manual-only: never runs on push/PR/schedule. Same reason as the
# other two Groq-backed demo workflows in this repo: this project's
# own dev sandbox has api.groq.com blocked at the network-egress-
# policy level, so the live call happens here instead. See
# tools/paper_rigor/README.md "AI-generated advisory reads" for what
# this does and does not verify.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-tests-and-live-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/paper_rigor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification_lint (real dependency) then paper_rigor (editable, with dev extras)
        run: |
          pip install -e ../verification_lint
          pip install -e ".[dev]"

      - name: Run offline test suite (no network, no secret required)
        run: python3 -m pytest -q

      - name: List currently available Groq models
        # Same ground-truth check as the other two workflows --
        # DEFAULT_MODEL is a plain string constant and can drift.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API }}
        run: |
          curl -sS https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "User-Agent: paper-rigor-worklist-triage/0.1 (+https://github.com/danofairanks/PIQOS---AI---Research-public-)" \
            | python3 -m json.tool

      - name: Run worklist-triage live demo against Groq
        env:
          # Repo secret is named GROQ_API; worklist_triage.py reads
          # GROQ_API_KEY specifically -- mapped here, same as the
          # other two workflows, so the secret's stored name doesn't
          # need to match the code's env var name.
          GROQ_API_KEY: ${{ secrets.GROQ_API }}
        run: python3 examples/worklist_triage_demo.py
