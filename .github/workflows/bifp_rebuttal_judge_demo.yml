name: bifp rebuttal-judge live demo (manual)

# Manual-only: never runs on push/PR/schedule. Exists to run
# tools/bifp/examples/rebuttal_judge_demo.py somewhere that can reach
# api.groq.com, since it needs a real GROQ_API_KEY and this project's
# own dev sandboxes have had that host blocked at the network-egress
# level. See tools/bifp/README.md "AI-generated advisory reads" for
# what this does and does not verify.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-tests-and-live-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bifp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bifp (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Run offline test suite (no network, no secret required)
        run: python3 -m pytest -q

      - name: List currently available Groq models
        # Ground truth for DEFAULT_MODEL in rebuttal_judge.py, which is
        # a plain string constant and can drift out of date as Groq's
        # catalog changes -- confirming against the real endpoint here
        # instead of guessing again if the next step 404s.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API }}
        run: |
          curl -sS https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "User-Agent: bifp-rebuttal-judge/0.1 (+https://github.com/danofairanks/PIQOS---AI---Research-public-)" \
            | python3 -m json.tool

      - name: Run rebuttal-judge live demo against Groq
        env:
          # Repo secret is named GROQ_API; rebuttal_judge.py reads
          # GROQ_API_KEY specifically (matches Groq's own SDK/docs
          # convention) -- mapped here so nothing in the package code
          # needs to know or care what the secret happens to be named.
          GROQ_API_KEY: ${{ secrets.GROQ_API }}
        run: python3 examples/rebuttal_judge_demo.py
