[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "case-scaffold"
version = "0.1.0"
description = "Scaffolding generator and structural linter for this repository's case_studies/ house format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PIQOS AI Research (Public)" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
case-scaffold = "case_scaffold.cli:main"

[tool.setuptools.packages.find]
include = ["case_scaffold*"]
