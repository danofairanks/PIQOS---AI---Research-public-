[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigor-cosplay"
version = "0.1.0"
description = "Text classifier for Rigor Cosplay: cosmetic pushback, weak-man steelmanning, and honesty-as-flattery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PIQOS AI Research (Public)" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rigor-cosplay = "rigor_cosplay.cli:main"

[tool.setuptools.packages.find]
include = ["rigor_cosplay*"]
